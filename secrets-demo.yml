# secrets-demo.yml — 演示：public 仓库如何用 GitHub Actions Secrets 注入 API key
#
# 本 workflow 仅用于「演示 / 自检」，不会自动定时跑（on: workflow_dispatch）。
# 在 GitHub 仓库 → Actions → "Secrets Demo" → "Run workflow" 手动触发即可。
#
# 核心目的：证明 secret 在 public 仓库里「代码与 git 历史都看不到」，
# 只在 CI 运行时被注入为环境变量，用完即弃。
name: Secrets Demo

on:
  workflow_dispatch:   # 仅手动触发，不干扰 daily/morning/evening 定时流水线

jobs:
  secret-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖（仅需 utils 软依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ====================================================================
      # 关键一步：把 repo Secrets 注入为本次 job 的环境变量。
      # ${{ secrets.NAME }} 在日志 / 代码中永远显示为 ***，永不泄露明文。
      # 本地 clone 或 PR 都没有这些变量（fork/PR 默认也拿不到 repo secret）。
      # ====================================================================
      - name: 注入 Secrets → 环境变量（运行时才可见）
        env:
          FRED_API:           ${{ secrets.FRED_API }}
          ALPHA_API:          ${{ secrets.ALPHA_API }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERPAPI:            ${{ secrets.SERPAPI }}
        run: |
          echo "GITHUB_ACTIONS = $GITHUB_ACTIONS"
          # secrets_loader 会识别 github_actions 环境、脱敏展示、校验必需项、扫描泄露
          python secrets_loader.py

      # 演示：secret 不会出现在任何被提交的文件里（仅内存中使用）
      - name: 验证 secret 未落盘
        run: |
          if grep -rq "DEEPSEEK_API_KEY=sk-" . --include="*.py" --include="*.toml" --include="*.yml" 2>/dev/null; then
            echo "❌ 发现明文 key，请检查"
            exit 1
          else
            echo "✅ 仓库中没有明文 key"
          fi
